<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengerjakan Kuis - ReflectTime</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans" onload="initQuizPage()">
    <!-- Header Timer -->
    <header class="bg-slate-900 text-white py-4 px-8 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <div>
            <h2 id="quizTitleHeader" class="font-bold text-lg">Memuat Kuis...</h2>
            <p id="studentInfo" class="text-xs text-slate-400"></p>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-right">
                <span class="text-xs text-slate-400 block">SISA WAKTU</span>
                <span id="timerDisplay" class="text-2xl font-mono font-bold text-amber-400">00:00</span>
            </div>
        </div>
    </header>

    <!-- Konten GForm -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <div id="formContainer">
            <!-- 1. Iframe dikembalikan tanpa onload -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden mb-6">
                <iframe id="gformIframe" src="" width="100%" height="800" frameborder="0" marginheight="0" marginwidth="0">Memuat Google Form...</iframe>
            </div>

            <!-- 2. Tombol Konfirmasi Manual -->
            <div class="text-center bg-blue-50 p-6 rounded-2xl border border-blue-100">
                <p class="text-blue-800 font-medium mb-4">Apakah Anda sudah menekan tombol "Kirim" atau "Submit" pada Google Form di atas?</p>
                <button onclick="handleEarlySubmit()" class="bg-blue-600 text-white px-8 py-3 rounded-full font-bold hover:bg-blue-700 shadow-md">
                    ✅ Ya, Saya Sudah Submit
                </button>
            </div>
        </div>

        <div id="timeoutMessage" class="hidden text-center py-20">
            <h2 class="text-3xl font-bold text-red-600 mb-2">Waktu Habis!</h2>
            <p class="text-gray-600 mb-6">Sesi pengerjaan kuis ini telah berakhir dan dikunci otomatis.</p>
            <a href="index.html" class="bg-slate-900 text-white px-6 py-3 rounded-full font-medium">Kembali ke Beranda</a>
        </div>
    </main>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script src="app.js"></script>
</body>
</html>
