<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Mahasiswa - ReflectTime</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-gray-100">
        <h2 class="text-2xl font-bold mb-2 text-center">Masuk Kuis Refleksi</h2>
        
        <!-- Step 0: Login SSO (Awal) -->
        <div id="stepAuth" class="space-y-4 text-center mt-6">
            <p class="text-gray-500 text-sm mb-4">Gunakan email UGM Anda (@mail.ugm.ac.id) untuk masuk ke dalam sistem.</p>
            <button onclick="loginWithGoogle()" class="w-full bg-red-700 text-white py-3 rounded-lg font-medium hover:bg-red-800 flex items-center justify-center gap-2 shadow-sm">
                <!-- Ikon Google sederhana -->
                <svg class="w-5 h-5 bg-white rounded-full p-0.5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Login dengan Google UGM
            </button>
        </div>

        <!-- Step 1: Input PIN (Disembunyikan awalnya) -->
        <div id="stepPin" class="space-y-4 hidden mt-6">
            <div class="bg-blue-50 text-blue-700 p-3 rounded-lg text-sm mb-4 text-center">
                Berhasil login sebagai:<br><strong id="displayUserEmail"></strong>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">PIN Kuis (6 Digit)</label>
                <input type="text" id="studentPin" class="w-full px-4 py-2 border rounded-lg text-center tracking-widest text-xl font-mono" placeholder="123456" maxlength="6">
            </div>
            <button onclick="verifyStudentPin()" class="w-full bg-slate-900 text-white py-2 rounded-lg font-medium hover:bg-slate-800">Lanjutkan</button>
        </div>

        <!-- Step 2: Input Identitas (Disembunyikan awalnya) -->
        <div id="stepIdentity" class="space-y-4 hidden mt-6">
            <div class="p-3 bg-green-50 text-green-700 rounded-lg text-sm mb-4">
                ✓ Kuis ditemukan: <span id="activeQuizName" class="font-bold"></span>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap (Otomatis dari Akun)</label>
                <!-- Dibuat readonly dan abu-abu agar tidak bisa diedit mahasiswa -->
                <input type="text" id="studentName" class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-600 font-medium" readonly>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">NIU / NIM</label>
                <input type="text" id="studentNiu" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none" placeholder="21/XXXXX/PA/XXXXX">
            </div>
            <button onclick="startQuizSession()" class="w-full bg-green-600 text-white py-2 rounded-lg font-medium hover:bg-green-700">Mulai Kerjakan Kuis</button>
        </div>

        <div class="text-center mt-6">
            <a href="index.html" class="text-xs text-gray-500 hover:underline">← Kembali ke Beranda</a>
        </div>
    </div>

    <!-- SCRIPT FIREBASE DIPERBARUI: Menambahkan firebase-auth.js -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
</body>
</html>
