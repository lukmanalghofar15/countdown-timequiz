<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Asisten/Pengajar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans" onload="loadDashboard(); loadGrades()">
    <nav class="flex justify-between items-center py-4 px-8 bg-white shadow-sm">
        <div class="text-xl font-bold">⏱ Panel Asisten/Pengajar</div>
        <button onclick="logout()" class="text-red-600 font-medium text-sm hover:underline">Keluar</button>
    </nav>

    <main class="max-w-6xl mx-auto px-8 py-8">
        <!-- Form Pembuatan Kuis -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
            <h3 class="text-lg font-bold mb-4">Buat Quiz Baru</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Quiz</label>
                    <input type="text" id="quizTitle" class="w-full px-4 py-2 border rounded-lg" placeholder="Cth: Refleksi Pekan 1">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Link Embed Google Form (SRC)</label>
                    <input type="text" id="quizUrl" class="w-full px-4 py-2 border rounded-lg" placeholder="https://docs.google.com/forms/d/e/.../viewform?embedded=true">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Durasi (Menit)</label>
                    <input type="number" id="quizDuration" class="w-full px-4 py-2 border rounded-lg" placeholder="15">
                </div>
            </div>
            <button onclick="createQuiz()" class="bg-slate-900 text-white px-6 py-2 rounded-lg font-medium hover:bg-slate-800">Generate PIN & Kuis</button>
        </div>

        <!-- Daftar Kuis Aktif -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="text-lg font-bold mb-4">Daftar Kuis Kamu</h3>
            <div id="quizListContainer" class="space-y-4">
                <!-- Data akan dimuat via JS -->
            </div>
        </div>
        <!-- ================= BAGIAN FITUR NILAI ================= -->
        <div class="mt-12 border-t pt-8">
            <h2 class="text-2xl font-bold text-blue-600 mb-6">📊 Rekap Nilai Peserta/Mahasiswa</h2>
            
            <!-- Form Input Nilai -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
                <h3 class="text-lg font-bold mb-4 border-b pb-2">Input Nilai Mahasiswa</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Judul / Materi</label>
                        <input type="text" id="practicumTitle" class="w-full px-4 py-2 border rounded-lg" placeholder="Cth: Percepatan Gravitasi">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Mahasiswa</label>
                        <input type="text" id="studentNameGrade" class="w-full px-4 py-2 border rounded-lg" placeholder="Nama Lengkap Mahasiswa">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">NIM</label>
                        <input type="text" id="studentNiuGrade" class="w-full px-4 py-2 border rounded-lg" placeholder="Cth: 21/12345/PA/6789">
                    </div>
                </div>

                <!-- Komponen Dinamis -->
                <div class="mb-4">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-medium text-gray-700">Komponen Penilaian & Bobot</label>
                        <button onclick="addComponentRow()" class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded hover:bg-blue-200 font-medium">+ Tambah Komponen</button>
                    </div>
                    <div id="componentsContainer" class="space-y-3">
                        <div class="flex gap-2 component-row">
                            <input type="text" class="comp-name w-1/2 px-3 py-2 border rounded bg-gray-50" placeholder="Nama (cth: Laporan)">
                            <input type="number" class="comp-score w-1/4 px-3 py-2 border rounded bg-gray-50" placeholder="Nilai (0-100)">
                            <input type="number" class="comp-weight w-1/4 px-3 py-2 border rounded bg-gray-50" placeholder="Bobot (%)">
                        </div>
                    </div>
                    <p class="text-xs text-gray-400 mt-2">*Pastikan total bobot rasio mencapai 100%.</p>
                </div>
                <button onclick="saveGrade()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700">Simpan Nilai</button>
            </div>

            <!-- Daftar Nilai Terinput -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-12">
                <h3 class="text-lg font-bold mb-4 border-b pb-2">Riwayat Input Nilai</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm">
                                <th class="p-3 border-b">Materi</th>
                                <th class="p-3 border-b">Nama & NIM</th>
                                <th class="p-3 border-b text-center">Nilai Akhir</th>
                                <th class="p-3 border-b text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="gradesTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
