<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk / Daftar - ReflectTime</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-gray-100">
        <h2 id="formTitle" class="text-2xl font-bold mb-2 text-center">Login Dosen</h2>
        <p class="text-sm text-center text-red-600 font-medium mb-6 bg-red-50 py-2 rounded">Wajib gunakan email @ugm.ac.id</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email UGM</label>
                <input type="email" id="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900" placeholder="nama.dosen@ugm.ac.id">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900" placeholder="••••••••">
            </div>
            <button onclick="handleAuth()" id="submitBtn" class="w-full bg-slate-900 text-white py-2 rounded-lg font-medium hover:bg-slate-800">Masuk</button>
        </div>

        <p class="text-center text-sm text-gray-600 mt-6">
            <span id="toggleText">Belum punya akun?</span> 
            <button onclick="toggleMode()" class="text-slate-900 font-bold underline ml-1">Daftar</button>
        </p>
        <div class="text-center mt-4">
            <a href="index.html" class="text-xs text-gray-500 hover:underline">← Kembali ke Beranda</a>
        </div>
    </div>

    <!-- SCRIPT AUTO-LOGIN: Jika sudah pernah masuk dan belum logout, langsung lompat ke dashboard -->
    <script>
        if (localStorage.getItem('loggedUser')) {
            window.location.href = "dashboard.html";
        }
    </script>
    
    <!-- SCRIPT FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="app.js"></script>
</body>
</html>
